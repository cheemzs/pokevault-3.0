<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeVault — Login</title>
  <link rel="icon" href="/pfp.jpeg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-box">
    <div class="auth-logo">
      <img src="/pfp.jpeg" alt="PokeVault Logo" class="auth-logo-img" />
    </div>
    <h1 class="auth-title">PokeVault</h1>
    <p class="auth-subtitle">Track your Pokémon collection in SGD</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-btn-login"    onclick="showTab('login')">Log in</button>
      <button class="auth-tab"        id="tab-btn-register" onclick="showTab('register')">Register</button>
    </div>

    <div id="tab-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="form-group" style="margin-top:12px;">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="Your password" autocomplete="current-password" />
      </div>
      <p class="auth-error" id="login-error"></p>
      <button class="btn-primary full-width" style="margin-top:8px;" onclick="login()">Log in</button>
    </div>

    <div id="tab-register" style="display:none;">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="form-group" style="margin-top:12px;">
        <label>Password <span style="color:var(--text3);font-size:11px;">(min 6 chars)</span></label>
        <input type="password" id="reg-pass" placeholder="Choose a password" autocomplete="new-password" />
      </div>
      <p class="auth-error" id="reg-error"></p>
      <button class="btn-primary full-width" style="margin-top:8px;" onclick="register()">Create account</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    // ── Theme init ───────────────────────────────────────────────
    (function () {
      const saved = localStorage.getItem('pv-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved === 'dark2' ? 'dark' : saved);
    })();

    // ── Supabase client ──────────────────────────────────────────
    // IMPORTANT: Replace these two values with your own from
    // Supabase → Project Settings → API
    const SUPABASE_URL = window.__SUPABASE_URL__ || 'https://jqzwvcjkekvdyimhryha.supabase.co';
    const SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY__ || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impxend2Y2prZWt2ZHlpbWhyeWhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzU5OTYsImV4cCI6MjA5NjE1MTk5Nn0.waU_KSWUuB0W_0Zu7tizbraAxmSpXyEVnKWCQnruXjs';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // If already logged in, skip to the app
    sb.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = '/';
    });

    function showTab(tab) {
      document.getElementById('tab-login').style.display    = tab === 'login'    ? 'block' : 'none';
      document.getElementById('tab-register').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('tab-btn-login').classList.toggle('active',    tab === 'login');
      document.getElementById('tab-btn-register').classList.toggle('active', tab === 'register');
    }

    async function login() {
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-pass').value;
      const errEl    = document.getElementById('login-error');
      errEl.textContent = '';
      if (!email || !password) { errEl.textContent = 'Please fill in both fields.'; return; }

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { errEl.textContent = error.message; return; }
      window.location.href = '/';
    }

    async function register() {
      const email    = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-pass').value;
      const errEl    = document.getElementById('reg-error');
      errEl.textContent = '';
      if (!email || !password)  { errEl.textContent = 'Please fill in both fields.'; return; }
      if (password.length < 6)  { errEl.textContent = 'Password must be at least 6 characters.'; return; }

      const { error } = await sb.auth.signUp({ email, password });
      if (error) { errEl.textContent = error.message; return; }
      window.location.href = '/';
    }

    // Allow Enter key on inputs
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const loginVisible = document.getElementById('tab-login').style.display !== 'none';
      if (loginVisible) login(); else register();
    });
  </script>
</body>
</html>
